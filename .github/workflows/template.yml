name: Initialize issues

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  initialize-issues:
    # Run once even if GitHub Classroom pushes the feedback branch first.
    # Manual runs allow recovery if the first run failed.
    if: ${{ github.run_number == 1 || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Create initial issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/template/cpissues.sh
